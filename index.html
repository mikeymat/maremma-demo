<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0605">
<title>Maremma che Pizza! Ordina online</title>
<style>
:root {
  --bg: #0d0605; --ink: #fff3e6; --muted: #d9bfae; --red: #e8301a; --neon: #ff8a4c; --neon-2: #ff5a1f;
  --cream: #fff4e8; --dark: #1a0b07; --ok: #62d58f; --blue: #1f6feb; --line: rgba(255,138,76,.35);
  --brick: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><path d='M0 0H64M0 32H64M0 0V32M32 32V64' stroke='rgba(0,0,0,0.5)' stroke-width='3' fill='none'/></svg>");
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* ---------- cornice della proposta ---------- */
.proposal { padding: 22px 20px 0; max-width: 1080px; margin: 0 auto; }
.proposal small { color: var(--neon); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
.proposal h1 { margin: 4px 0; font-size: clamp(24px, 4vw, 34px); line-height: 1.15; }
.proposal p { margin: 0; color: var(--muted); max-width: 62ch; }
.stage { max-width: 1080px; margin: 0 auto; padding: 22px 20px 56px; display: grid; grid-template-columns: 410px 1fr; gap: 40px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; justify-items: center; } .notes { width: 100%; max-width: 560px; } }

/* ---------- telefono ---------- */
.phone { position: relative; width: min(100%, 390px); height: min(800px, 86vh); min-height: 580px; border-radius: 40px; border: 10px solid #000; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 60px rgba(232,48,26,.18); overflow: hidden; }
.screen {
  height: 100%; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; padding-bottom: 130px; scrollbar-width: none;
  background:
    radial-gradient(90% 38% at 50% 10%, rgba(255,110,50,.55), transparent 70%),
    var(--brick),
    linear-gradient(180deg, #7a1a0c 0%, #4a0f08 55%, #2a0805 100%);
}
.screen::-webkit-scrollbar { display: none; }

/* ---------- testata ---------- */
.top { position: relative; padding: 14px 14px 0; }
.bar { display: flex; align-items: flex-start; justify-content: space-between; }
.pill-btn, .round-btn { border: 0; background: rgba(255,255,255,.94); color: var(--dark); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.pill-btn { height: 44px; padding: 0 12px 0 10px; border-radius: 22px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.flag { width: 26px; height: 18px; border-radius: 3px; background: linear-gradient(90deg, #1f9d4a 33%, #fff 33% 66%, #d62828 66%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.round-btn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; }
.round-btn svg { width: 24px; height: 24px; stroke: var(--dark); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.sign { text-align: center; margin: -6px auto 0; width: 250px; }
.sign svg.neonpizza { width: 120px; height: 82px; display: block; margin: 0 auto; }
.neon { fill: none; stroke: #ffd9b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px #ff9a5a) drop-shadow(0 0 10px #ff4d1a); }
.logo-1, .logo-2 { display: block; color: #fff0e0; text-shadow: 0 0 4px #ffb27a, 0 0 12px #ff6a2a, 0 0 28px #ff3d0a; }
.logo-1 { font-size: 34px; font-weight: 300; letter-spacing: .03em; line-height: 1; margin-top: 2px; }
.logo-2 { font-size: 34px; font-weight: 600; font-style: italic; line-height: 1.05; }
.flick { animation: flick 5s infinite; }
@keyframes flick { 0%, 17%, 19%, 23%, 100% { opacity: 1; } 18%, 21% { opacity: .35; } }

/* ---------- riquadro titolo (stile originale, più leggibile) ---------- */
.headline { position: relative; margin: 14px 14px 0; padding: 20px 18px 18px; background: var(--cream); color: var(--dark); border-radius: 26px; text-align: center; box-shadow: 0 0 0 3px rgba(255,138,76,.55), 0 0 28px rgba(255,90,31,.45), 0 16px 40px rgba(0,0,0,.5); }
.headline h2 { margin: 0; font: 800 28px/1.12 Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
.headline h2 span { color: var(--red); }
.status { display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 0; padding: 6px 12px; border-radius: 999px; background: rgba(31,157,74,.12); color: #17803b; font-weight: 700; font-size: 13.5px; }
.status i { width: 9px; height: 9px; border-radius: 50%; background: #1f9d4a; animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(31,157,74,.55); } 70%, 100% { box-shadow: 0 0 0 9px rgba(31,157,74,0); } }
.cta { position: relative; display: block; width: 100%; min-height: 58px; margin-top: 14px; border: 0; border-radius: 18px; color: #fff; font-size: 20px; font-weight: 800; letter-spacing: .01em; background: linear-gradient(180deg, #ff4a2b, #d9230f); box-shadow: 0 6px 0 #8f1608, 0 12px 28px rgba(232,48,26,.5); animation: glow 2.6s ease-in-out infinite; }
.cta:active { transform: translateY(3px); box-shadow: 0 3px 0 #8f1608, 0 6px 16px rgba(232,48,26,.5); }
@keyframes glow { 50% { box-shadow: 0 6px 0 #8f1608, 0 12px 38px rgba(255,90,31,.85); } }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.fact { background: #f6e6d6; border-radius: 12px; padding: 8px 4px; font-size: 11.5px; color: #7a5a48; }
.fact b { display: block; color: var(--dark); font-size: 12.5px; white-space: nowrap; }

/* ---------- orario ritiro ---------- */
.when { margin: 18px 14px 0; padding: 14px; border-radius: 20px; background: rgba(15,4,3,.78); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.when h3 { margin: 0 0 10px; font-size: 16px; }
.slots { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.slots::-webkit-scrollbar { display: none; }
.slot { flex: none; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; font-weight: 700; }
.slot[aria-pressed=true] { background: var(--neon); border-color: var(--neon); color: var(--dark); }

/* ---------- categorie ---------- */
.cats { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; overflow-x: auto; padding: 16px 14px 10px; scrollbar-width: none; background: linear-gradient(rgba(42,8,5,.96) 70%, transparent); }
.cats::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--neon); background: rgba(0,0,0,.45); font-weight: 700; box-shadow: 0 0 10px rgba(255,138,76,.25); }
.chip[aria-current=true] { background: var(--neon); color: var(--dark); box-shadow: 0 0 16px rgba(255,138,76,.7); }

/* ---------- piatti ---------- */
.sec { padding: 0 14px; scroll-margin-top: 76px; }
.sec h3 { margin: 12px 2px 10px; font-size: 22px; text-shadow: 0 0 12px rgba(255,106,42,.8); }
.phone { overflow: hidden; overflow: clip; }
/* card compatte: foto, testo e prezzo/+ sulla stessa riga */
.sec .dish { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; padding: 10px; margin-bottom: 10px; border-radius: 18px; }
.dish .pic { width: 64px; height: 64px; border-radius: 14px; font-size: 32px; }
.dish .pic svg { width: 58px; height: 58px; }
.dish .foot { grid-column: auto; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 0; border-top: 0; }
.dish .price { font-size: 16px; }
.dish .qty { gap: 3px; }
.dish .qty button { width: 40px; height: 40px; font-size: 22px; }
.dish .qty span { min-width: 20px; font-size: 16px; }
.dish .txt h4 { font-size: 16.5px; }
.dish .txt p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12.5px; }
.dish .badge { margin-bottom: 2px; padding: 0 8px; font-size: 10.5px; }
.dish .hint2 { margin-top: 2px; font-size: 12px; }
.stick { position: sticky; top: 0; z-index: 3; padding-top: 12px; background: linear-gradient(rgba(42,8,5,.97) 82%, transparent); }
.stick .cats { position: static; z-index: auto; padding: 8px 14px 8px; background: none; }
.cats[hidden] { display: none; }
.search { position: relative; margin: 0 14px; }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--neon); fill: none; stroke-width: 2.2; stroke-linecap: round; pointer-events: none; }
.search input { -webkit-appearance: none; appearance: none; width: 100%; height: 48px; padding: 0 46px 0 46px; border-radius: 999px; border: 1.5px solid var(--line); background: rgba(15,4,3,.92); color: var(--ink); font: 500 16px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; box-shadow: 0 0 14px rgba(255,138,76,.18); outline: none; }
.search input::placeholder { color: #c9a996; }
.search input:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgba(255,138,76,.28), 0 0 18px rgba(255,138,76,.35); }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.qclear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255,255,255,.14); color: var(--ink); font-size: 15px; }
.qclear[hidden] { display: none; }
.nores { margin: 24px 14px; padding: 18px; text-align: center; border-radius: 18px; border: 1px dashed var(--line); background: rgba(15,4,3,.8); color: var(--muted); }
.dish.tap { cursor: pointer; }
.dname { all: unset; cursor: pointer; }
.dname:focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; border-radius: 6px; }
.hint2 { display: inline-block; margin-top: 4px; font-size: 12.5px; font-weight: 700; color: var(--neon); }
.mods { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 400; color: #7a5a48; }
.pd { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #160805; transform: translateY(100%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s; }
.pd.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s; }
.pdscroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 14px; scrollbar-width: none; }
.pdscroll::-webkit-scrollbar { display: none; }
.pdpic { aspect-ratio: 4 / 3; background: repeating-linear-gradient(180deg, #6b3a1e 0 31px, #5a2f17 31px 33px); }
.pdpic svg { display: block; width: 100%; height: 100%; }
.pdx { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(0,0,0,.6); color: var(--ink); font-size: 18px; }
.pdbody { padding: 16px 16px 0; }
.pdbody h2 { margin: 4px 0 0; font: 800 30px/1.1 Georgia, "Times New Roman", serif; }
.pdbody .price { margin-top: 4px; font-size: 20px; }
.pdbody .desc { margin: 8px 0 0; color: var(--muted); }
.pdsec { margin: 20px 16px 0; }
.pdsec h3 { margin: 0; font-size: 18px; }
.pdsec p { margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
.prow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 14px; margin-bottom: 8px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); font-size: 16px; text-align: left; }
.prow .chk { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--neon); font-weight: 800; color: var(--dark); }
.prow.on .chk { background: var(--neon); }
.prow .pl { flex: 1; }
.prow .pt { font-size: 13.5px; font-weight: 700; color: #ffc9a3; }
.prow.base:not(.on) .pl { text-decoration: line-through; opacity: .6; }
.prow.base:not(.on) .pt { color: #ff8f86; }
.pdbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: #0d0504; border-top: 1px solid var(--line); }
.pdadd { flex: 1; min-height: 54px; border: 0; border-radius: 16px; color: #fff; font-weight: 800; font-size: 17px; background: linear-gradient(180deg, #ff4a2b, #cf2410); box-shadow: 0 4px 0 #8f1608; }
.pdadd:active { transform: translateY(3px); box-shadow: 0 1px 0 #8f1608; }
.dish { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px 12px; align-items: center; padding: 12px; margin-bottom: 12px; border-radius: 22px; background: rgba(15,4,3,.82); border: 1px solid var(--line); backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.pic { position: relative; flex: none; width: 82px; height: 82px; border-radius: 18px; background: radial-gradient(circle at 50% 40%, #4a1d10, #240b06); display: grid; place-items: center; font-size: 40px; overflow: hidden; }
.pic svg { width: 76px; height: 76px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
.txt { min-width: 0; }
.foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding-top: 2px; border-top: 1px solid rgba(255,138,76,.18); }
.badge { display: inline-block; margin-bottom: 3px; padding: 1px 9px; border-radius: 999px; background: var(--neon); color: var(--dark); font-size: 11px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
.badge.hot { background: #ff3d2e; color: #fff; }
.txt h4 { margin: 0; font-size: 18px; line-height: 1.2; }
.txt p { margin: 2px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
.price { font-weight: 800; font-size: 17px; color: #ffc9a3; text-shadow: 0 0 10px rgba(255,138,76,.55); }
.qty { display: flex; align-items: center; gap: 4px; }
.qty button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: linear-gradient(180deg, #ff4a2b, #d9230f); color: #fff; font-size: 26px; font-weight: 700; line-height: 1; box-shadow: 0 0 14px rgba(255,90,31,.6); }
.qty button.minus { background: rgba(255,255,255,.12); box-shadow: none; border: 1px solid var(--line); }
.qty span { min-width: 22px; text-align: center; font-weight: 800; font-size: 17px; }
.hint { margin: 10px 14px 0; padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--line); background: rgba(0,0,0,.4); color: var(--muted); font-size: 13.5px; }

/* ---------- barra ordine ---------- */
.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 34px 12px 14px; background: linear-gradient(transparent, rgba(20,4,2,.95) 62%); pointer-events: none; }
.dock > * { pointer-events: auto; }
.cart { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 68px; padding: 10px 10px 10px 14px; border: 0; border-radius: 22px; text-align: left; color: #fff; background: linear-gradient(180deg, #ff4a2b, #cf2410); box-shadow: 0 0 0 2px rgba(255,205,165,.4), 0 10px 30px rgba(232,48,26,.55); }
.cart.empty { justify-content: center; min-height: 58px; background: rgba(15,4,3,.9); color: var(--ink); border: 1.5px dashed var(--neon); box-shadow: 0 0 18px rgba(255,138,76,.25); font-weight: 700; font-size: 16px; animation: nudge 3s ease-in-out infinite; }
@keyframes nudge { 50% { box-shadow: 0 0 26px rgba(255,138,76,.55); } }
.thumbs { display: flex; flex: none; padding-left: 8px; }
.thumbs span { position: relative; width: 38px; height: 38px; margin-left: -12px; border-radius: 50%; background: #2a0f08; border: 2px solid #fff; display: grid; place-items: center; font-size: 20px; overflow: hidden; }
.thumbs span svg { width: 32px; height: 32px; }
.thumbs .more { background: #fff; color: var(--dark); font-size: 13px; font-weight: 800; }
.cart .mid { flex: 1; min-width: 0; line-height: 1.2; }
.cart .mid b { display: block; font-size: 16px; white-space: nowrap; }
.cart .mid small { white-space: nowrap; }
.cart .mid small { display: block; font-size: 12px; opacity: .92; line-height: 1.25; }
.cart .go { flex: none; display: flex; align-items: center; gap: 6px; height: 50px; padding: 0 12px; border-radius: 16px; background: var(--cream); color: var(--dark); font-weight: 800; font-size: 16px; white-space: nowrap; }
.cart .go i { font-style: normal; font-size: 22px; line-height: 1; color: var(--red); }
.dock.enter .cart { animation: rise .45s cubic-bezier(.2,.9,.3,1.25); }
@keyframes rise { from { transform: translateY(46px); opacity: 0; } }
.bump { animation: bump .3s; }
@keyframes bump { 40% { transform: scale(1.035); } }

/* ---------- riepilogo ordine ---------- */
.sheet { position: absolute; inset: 0; z-index: 9; display: flex; align-items: flex-end; background: rgba(0,0,0,.62); opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet.open { opacity: 1; pointer-events: auto; }
.panel { width: 100%; max-height: 84%; overflow: auto; background: var(--cream); color: var(--dark); border-radius: 28px 28px 0 0; padding: 10px 18px 22px; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); scrollbar-width: none; }
.sheet.open .panel { transform: none; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: #d8c3b0; margin: 0 auto 12px; }
.panel h3 { margin: 0 0 4px; font: 800 25px/1.1 Georgia, "Times New Roman", serif; }
.panel .sub { margin: 0 0 6px; color: #7a5a48; font-size: 14px; }
.sline { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #ecd9c6; }
.sline b { font-size: 15.5px; }
.mini { display: flex; align-items: center; gap: 2px; }
.mini button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #d9b99c; background: #fff; color: var(--dark); font-size: 21px; font-weight: 700; line-height: 1; }
.mini span { min-width: 22px; text-align: center; font-weight: 800; }
.sline .lp { min-width: 64px; text-align: right; font-weight: 800; }
.srow { display: flex; justify-content: space-between; padding: 7px 0; color: #5a3d2e; font-size: 15px; }
.srow.t { margin-top: 8px; padding-top: 10px; border-top: 2px solid var(--dark); color: var(--dark); font: 800 21px Georgia, "Times New Roman", serif; }
.panel .cta { margin-top: 14px; }
.ghost { display: block; width: 100%; min-height: 48px; margin-top: 6px; border: 0; background: transparent; color: #7a5a48; font-weight: 700; }
.done { text-align: center; padding: 14px 0 6px; }
.done .code { margin: 8px 0; font: 800 36px ui-monospace, Menlo, monospace; letter-spacing: 4px; color: var(--red); }
.who { margin: 14px 0 2px; }
.who h4 { margin: 0 0 8px; font-size: 15px; color: #5a3d2e; }
.who .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.who label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 700; color: #5a3d2e; }
.who input { width: 100%; height: 50px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #d9b99c; background: #fff; color: var(--dark); font: inherit; font-size: 16px; }
.who input[aria-invalid=true] { border-color: var(--red); box-shadow: 0 0 0 3px rgba(232,48,26,.18); }
.who .one { margin-top: 10px; }
.who .err { min-height: 18px; margin: 6px 0 0; color: var(--red); font-weight: 700; font-size: 13.5px; }
.flagsvg { display: inline-block; flex: none; width: 28px; height: 19px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.flagsvg svg { display: block; width: 100%; height: 100%; }
.pill-btn .flagsvg { width: 26px; height: 18px; }
.lang { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 16px; border: 1.5px solid var(--line); background: rgba(255,255,255,.04); font-weight: 700; font-size: 17px; text-align: left; }
.lang[aria-pressed=true] { border-color: var(--neon); background: rgba(255,138,76,.16); box-shadow: 0 0 14px rgba(255,138,76,.35); }
.lang .tick { margin-left: auto; color: var(--neon); font-size: 20px; opacity: 0; }
.lang[aria-pressed=true] .tick { opacity: 1; }
.imp { margin: 6px 0 10px; }
.imp[hidden] { display: none; }
.imp div { margin-bottom: 8px; }
.imp b { display: block; color: var(--ink); font-size: 12.5px; }
.copy { margin: 10px 0 0; font-size: 12.5px; }
.pagefoot { margin: 22px 14px 0; padding: 18px 16px; border-radius: 20px; background: rgba(15,4,3,.82); border: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }
.pagefoot h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--neon); }
.pagefoot .imp { margin: 0; }
.bar { justify-content: flex-start; }
.pill-btn .code { font-weight: 800; letter-spacing: .02em; }
.langwrap { position: relative; }
.langmenu { position: absolute; left: 0; top: 52px; z-index: 6; min-width: 200px; padding: 6px; border-radius: 18px; background: rgba(20,6,4,.97); border: 1.5px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.55); }
.langmenu[hidden] { display: none; }
.langmenu .lang { width: 100%; min-height: 48px; padding: 0 12px; border-color: transparent; background: none; box-shadow: none; font-size: 16px; color: var(--ink); }
.langmenu .lang[aria-pressed=true] { background: rgba(255,138,76,.18); border-color: transparent; box-shadow: none; }

.grp { display: flex; gap: 8px; }
.grp .round-btn { width: 44px; height: 44px; }
.toast { position: absolute; left: 16px; right: 16px; top: 16px; z-index: 12; background: #fff; color: var(--dark); padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 8px 24px rgba(0,0,0,.4); }

/* ---------- note a lato ---------- */
.notes h2 { margin: 0 0 6px; font-size: 22px; }
.notes > p { margin: 0 0 16px; color: var(--muted); }
.change { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid rgba(255,138,76,.22); }
.change .n { width: 32px; height: 32px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; box-shadow: 0 0 12px rgba(232,48,26,.6); }
.change h3 { margin: 0 0 2px; font-size: 16.5px; }
.change p { margin: 0; color: var(--muted); font-size: 14.5px; }
.change p b { color: var(--ink); font-weight: 600; }
.todo { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: #1b0d09; border: 1px solid rgba(255,138,76,.22); }
.todo h3 { margin: 0 0 6px; font-size: 15px; }
.todo ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }

html, body { height: 100%; margin: 0; }
.stage { display: block; max-width: none; margin: 0; padding: 0; }
.phone { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; min-height: 0; margin: 0 auto; border: 0; border-radius: 0; box-shadow: none; }
.top { padding-top: calc(14px + env(safe-area-inset-top)); }
.dock { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
.screen { padding-bottom: 150px; }

html, body { height: auto; min-height: 100%; }
html.lock, html.lock body { overflow: hidden; }

.pd { position: fixed; max-width: 480px; margin: 0 auto; }

function renderSlots() {
  $('slots').replaceChildren(...['asap', '20:00', '20:15', '20:30', '20:45', '21:00'].map((v) => {
    const b = el('button', { class: 'slot', 'aria-pressed': String(v === slot) }, v === 'asap' ? t('asap') : v);
    b.addEventListener('click', () => { slot = v; renderSlots(); dock(); if ($('sheet').classList.contains('open')) renderSheet(); });
    return b;
  }));
}

const screen = $('screen');
function stickH() { return $('stick').offsetHeight + 8; }
function scrollToEl(s, onlyDown) {
  const inner = getComputedStyle(screen).overflowY !== 'visible';
  if (inner) { const y = s.offsetTop - stickH(); if (!onlyDown || screen.scrollTop < y) screen.scrollTo({ top: y, behavior: 'smooth' }); }
  else { const y = s.getBoundingClientRect().top + window.scrollY - stickH(); if (!onlyDown || window.scrollY < y) window.scrollTo({ top: y, behavior: 'smooth' }); }
}
function goTo(id) {
  if (query) clearSearch();
  const s = $('sec-' + id); if (s) scrollToEl(s, false);
}
function clearSearch() { query = ''; $('q').value = ''; $('qclear').hidden = true; $('cats').hidden = false; render(); }
$('q').addEventListener('input', () => {
  query = $('q').value.trim(); $('qclear').hidden = !$('q').value; $('cats').hidden = !!query; render();
  if (query) scrollToEl($('menu'), true);
});
$('qclear').addEventListener('click', () => { clearSearch(); $('q').focus(); });
$('q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { clearSearch(); e.stopPropagation(); } else if (e.key === 'Enter') $('q').blur(); });
function syncLock() { document.documentElement.classList.toggle('lock', $('sheet').classList.contains('open') || !!pd); }
$('cta').addEventListener('click', () => goTo('top'));
$('cart').addEventListener('click', () => (count() ? openSheet() : goTo('top')));
$('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
$('langbtn').addEventListener('click', toggleLangMenu);
$('pdx').addEventListener('click', closePd);
document.addEventListener('click', (e) => { if (!e.target.closest('.langwrap')) closeLangMenu(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (pd) closePd(); else closeSheet(); closeLangMenu(); } });
document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-current', 'false'));
  c.setAttribute('aria-current', 'true'); goTo(c.dataset.t);
}));
applyLang('it');
</script>
